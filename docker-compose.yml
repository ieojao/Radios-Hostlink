version: '3.8'

services:
  radio-web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - DATABASE_URL=sqlite:///radio.db
      - SECRET_KEY=sua-chave-secreta-aqui
    volumes:
      - ./static/uploads:/app/static/uploads
      - ./radio.db:/app/radio.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3

